name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 全量静态校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 浅检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python（固定版本并缓存依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: 安装固定版本校验依赖
        run: python3 -m pip install -r scripts/requirements-ci.txt

      - name: 校验合集时效性（内存重建比对，不覆盖工作区）
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import merge_docs

          expected = merge_docs.build_document()
          merged = merge_docs.MERGED
          if not merged.is_file():
              raise SystemExit("合集未入库：请提交 CodeTree-项目文档合集.md")
          if expected != merged.read_text(encoding="utf-8"):
              raise SystemExit("合集与源文档或工程文件不一致：请运行 python3 scripts/merge_docs.py 并提交")
          print("freshness: OK")
          PY

      - name: 生成文档合集与内容产物（压缩包/种子为二进制，不提交仓库）
        run: |
          python3 scripts/merge_docs.py
          python3 tools/content/build_dist.py
          python3 tools/content/sync_seed.py

      - name: 全量验收（内容 / 仓库 / 种子 / 文档 / 工作流）
        run: bash tools/verify/run_all.sh

  build:
    name: 全量构建与测试
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 浅检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 JDK、Android SDK 与 Gradle 缓存
        uses: ./.github/actions/setup-android
        with:
          java-version: '17'

      - name: 生成内容分发产物与内置种子（二进制不入库，构建前生成）
        run: |
          python3 tools/content/build_dist.py
          python3 tools/content/sync_seed.py

      - name: 全量单测与 Debug 构建（使用 setup-gradle 提供的 gradle 8.9）
        run: >-
          gradle :core:domain:test :plugin-api:test :runtime:safe-shell:test
          :app:assembleDebug --no-daemon --stacktrace

      - name: 上传夜间报告与 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports-${{ github.run_id }}
          path: |
            **/build/reports/**
            app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: warn
