name: Import CodeTree docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-codetree.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-codetree
  cancel-in-progress: true

jobs:
  import:
    name: Import CodeTree v0.6.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and extract
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/codetree.zip "https://aka.doubaocdn.com/s/Vj0ugQvn6v"
          unzip -o /tmp/codetree.zip -d .
          rm -f .github/workflows/import-codetree.yml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: import CodeTree v0.6.0 documentation"
          git push
