name: Import CodeTree v0.7.0

on:
  push:
    paths:
      - .github/workflows/import-codetree-v07.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-codetree-v07
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and unpack CodeTree v0.7.0
        run: |
          curl -L --fail --retry 8 --retry-delay 15 -o /tmp/codetree-v07.zip 'https://aka.doubaocdn.com/s/wTk7yrUXdt'
          unzip -o /tmp/codetree-v07.zip -d .

      - name: Commit and push
        run: |
          git config user.name 'CodeTree Bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'docs: refine CodeTree v0.7.0 mascot sheet'
          git push
