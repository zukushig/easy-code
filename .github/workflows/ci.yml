name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 文档、工作流与策略校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 浅检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python（固定版本并缓存依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: 安装固定版本校验依赖
        run: python3 -m pip install -r scripts/requirements-ci.txt

      - name: 校验单文件合集、时效性与压缩包
        run: python3 scripts/merge_docs.py --check

      - name: 校验工作流结构、效率约束与策略文本
        run: python3 scripts/validate_workflows.py

      - name: 校验视觉资产、设计令牌与更新条例
        run: python3 scripts/validate_design.py

  label:
    name: 按路径自动标签
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 应用路径标签
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
