name: 'Setup Android build'
description: '统一准备 JDK、Gradle 缓存与可选的国内镜像初始化脚本'

inputs:
  java-version:
    description: 'JDK 主版本，默认 17'
    required: false
    default: '17'
  use-cn-mirrors:
    description: '按仓库分别设置国内 Maven 镜像，默认关闭'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: 安装 JDK（缓存交给 setup-gradle 统一管理）
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: 启用 Gradle 依赖缓存与构建缓存
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        gradle-home-cache-cleanup: true

    - name: 准备可选镜像初始化脚本
      shell: bash
      run: |
        init_file="$RUNNER_TEMP/codetree-mirrors.gradle"
        source_file="${{ github.action_path }}/codetree-mirrors.gradle"
        if [ "${{ inputs.use-cn-mirrors }}" = "true" ]; then
          cp "$source_file" "$init_file"
        else
          echo '// 默认不启用镜像；Gradle 使用项目声明的仓库。' > "$init_file"
        fi
        echo "CODETREE_GRADLE_INIT=$init_file" >> "$GITHUB_ENV"
