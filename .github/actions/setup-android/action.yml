name: 'Setup Android build'
description: '统一准备 JDK、Android SDK、Gradle 缓存与可选的国内镜像初始化脚本'

inputs:
  java-version:
    description: 'JDK 主版本，默认 17'
    required: false
    default: '17'
  use-cn-mirrors:
    description: '按仓库分别设置国内 Maven 镜像，默认关闭'
    required: false
    default: 'false'
  sdk-packages:
    description: '需要安装的 Android SDK 组件，空格分隔；分号由脚本按单个参数传入'
    required: false
    default: 'platforms;android-34 build-tools;34.0.0 platform-tools'
  gradle-version:
    description: 'Gradle 版本（仓库不提交 wrapper jar，由 setup-gradle 提供并以 gradle 命令调用）'
    required: false
    default: '8.9'

runs:
  using: composite
  steps:
    - name: 安装 JDK（缓存交给 setup-gradle 统一管理）
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: 准备 Android SDK 命令行工具
      uses: android-actions/setup-android@v3

    - name: 安装 Android SDK 组件
      shell: bash
      env:
        SDK_PACKAGES: ${{ inputs.sdk-packages }}
      run: |
        set -euo pipefail
        for package in $SDK_PACKAGES; do
          echo "安装 Android SDK 组件: $package"
          sdkmanager --install "$package" > /dev/null
        done
        echo "已安装组件："
        sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34.0.0|platform-tools' || true

    - name: 启用 Gradle 依赖缓存与构建缓存（并安装指定版本 Gradle）
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ inputs.gradle-version }}
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        gradle-home-cache-cleanup: true

    - name: 准备可选镜像初始化脚本
      shell: bash
      run: |
        init_file="$RUNNER_TEMP/codetree-mirrors.gradle"
        source_file="${{ github.action_path }}/codetree-mirrors.gradle"
        if [ "${{ inputs.use-cn-mirrors }}" = "true" ]; then
          cp "$source_file" "$init_file"
        else
          echo '// 默认不启用镜像；Gradle 使用项目声明的仓库。' > "$init_file"
        fi
        echo "CODETREE_GRADLE_INIT=$init_file" >> "$GITHUB_ENV"
